name: validate

on:
  push:
    branches: [codex/second-brain]
  pull_request:

permissions:
  contents: read

jobs:
  repository-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked core
        run: python -m pip install --requirement requirements.lock
      - name: Install CPCS without re-resolving
        run: python -m pip install --no-deps .
      - name: Validate repository
        run: python lab/scripts/validate_repo.py
      - name: Verify installed command
        run: cpcs status
      - name: Security and release canaries
        run: python -m unittest discover -s lab/release/tests -p 'test_*.py'
