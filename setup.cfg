[metadata]
name = cpcs-video-intent
version = 0.24.0
description = Evidence-governed universal AI video intent and directing compiler
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE

[options]
packages = find_namespace:
python_requires = >=3.9
include_package_data = True
install_requires =
    Jinja2==3.1.6
    jsonschema==4.25.1
    networkx==3.2.1
    PyYAML==6.0.3
    defusedxml==0.7.1

[options.packages.find]
include =
    lab*
exclude =
    research*

[options.entry_points]
console_scripts =
    cpcs = lab.application.cli:main

[options.extras_require]
twelvelabs =
    twelvelabs==1.3.1
veo =
    google-auth==2.40.3
measurement =
    mediapipe==0.10.35
    opencv-python==4.13.0.92
