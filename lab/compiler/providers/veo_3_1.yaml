schema: cpcs.provider_capability/1.0
capability_id: provider-capability://google-vertex-ai/veo-3.1-generate-001/1.0
provider: google_vertex_ai
model: veo-3.1-generate-001
api_method: predictLongRunning
api_version: v1
source_urls:
  - https://cloud.google.com/vertex-ai/generative-ai/docs/model-reference/veo-video-generation
  - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/veo/3-1-generate
  - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/video/generate-videos-from-first-and-last-frames
supported_modes: [text_to_video, image_to_video, first_last_frame]
locations: [us-central1]
aspect_ratios: ["16:9", "9:16"]
durations_seconds: [4, 6, 8]
resolutions: [720p, 1080p]
frame_rate: 24
prompt_languages: [en]
sound_generation: false
sample_count:
  minimum: 1
  maximum: 4
seed:
  minimum: 0
  maximum: 4294967295
asset_roles:
  first_frame: image
  last_frame: image
control_rules:
  evaluation_only_paths:
    - motion.laban_shape_directional_curvature
  unsupported_paths: []
  default_disposition: compressed_to_text
policy:
  enhance_prompt: false
  person_generation: allow_adult
  prompt_budget_chars: 12000
  reference_prompt_budget_chars: 8000
  prompt_overflow: explicit_unsupported_loss
limitations:
  - Canonical motion values projected into prose are semantic requests, not executable joint trajectories.
  - Seeded requests preserve request identity but do not replace artifact-level verification.
  - Asset references require caller-supplied authorized Cloud Storage bindings.
  - The GA model is available only in us-central1 and does not generate sound.
  - Image-to-video inputs must satisfy the provider's current 20 MB input limit before submission.
  - This initial cross-mode profile exposes only 720p and 1080p; 4K remains unavailable until mode-specific qualification.
