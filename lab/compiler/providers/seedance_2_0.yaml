limitations:
- Manual text-to-video export only; this profile is not an API request and no Seedance
  runtime adapter is installed.
- The official release page documents 4 to 15 seconds. Export durations are whole
  seconds inside that range; the owner must match the UI settings.
- The official prompt guide distinguishes Seedance 2.0 shot numbers from Seedance
  2.5 timestamp support. Timing remains a canonical and verification requirement,
  not frame-exact provider control.
- Prompt character limits, frame rate, native sound settings and seeded replay are
  not verified for this UI route. Null means unknown, not unlimited.
- Prose and numeric JSON carriers are untested projections. No emphasis syntax or
  wording efficacy is asserted.
- Sample count, seed, storage URI and reference bindings are not submitted by this
  manual carrier. Reference still text is a separate authoring artifact.
dialect:
