artifact: CPCS_REASONING_PATH_REGISTRY
version: v0.1
registry_version: cpcs-reasoning-path-registry/v0.1
rule: bridge between CPCS semantics and repo-native canonical representation; provider_neutral;
  D4 enforced (no flat-text admission)
entries:
  cpcs.entity_state.identity:
    path_id: cpcs.entity_state.identity
    semantic_family: identity_state
    semantic_kind: STATE
    canonical_target: entities[]
    value_schema: cpcs.entity_state/1.0
    scope_types:
    - entity
    - shot
    - scene
    target_types:
    - actor
    - object
    merge_operator: structured_merge_by_entity_id
    source_control_types:
    - CT-ROLE-LABELS
    - Identity
    source_requirement_classes:
    - DIM-IDENTITY
    source_concept_ids:
    - identity continuity
    allowed_evidence_classes:
    - entity identity evidence
    forbidden_coercions:
    - flat_text
    - scalar_bool
    verification_counterpart: cpcs.expected_state.identity
    provider_neutral: true
    provenance_requirements:
    - requirement_ids
    - evidence_ids
    - epistemic_status
